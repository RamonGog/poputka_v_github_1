version: '3.8'

services:

  db:
    image: postgres:16-alpine
    contaner_name: warehouse_postgres_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db


  ports:
    - "5433:5432"



  volumes:
    - postgres_data:/var/lib/postgres/data



volumes:
  postgres_data:
